name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: gsd-core ${{ matrix.gsd }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 1.13.0 is the supported floor and gates merges; latest is a canary for dispatch drift.
    continue-on-error: ${{ matrix.gsd == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        gsd: ['1.13.0', 'latest']
    steps:
      - uses: actions/checkout@v7

      - name: install gsd-core
        run: npm install --global @opengsd/gsd-core@${{ matrix.gsd }}

      - name: quick planner dispatch reach test
        run: bash tests/test-quick-planner-dispatch.sh

      - name: plan-review contribution integration test
        run: bash tests/test-plan-review-contribution.sh

      - name: execute-point contribution reach test
        run: bash tests/test-execute-contributions.sh

      - name: root-layout install test
        run: bash tests/test-root-capability.sh

      - name: session-start smoke test
        run: bash tests/test-session-start.sh

      - name: proportionality smoke test
        run: bash tests/test-proportionality-check.sh
