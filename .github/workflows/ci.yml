name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install gsd-core
        run: npm install --global @opengsd/gsd-core@1.11.0

      - name: quick planner bridge integration test
        run: bash tests/test-quick-planner-bridge.sh

      - name: session-start smoke test
        run: bash tests/test-session-start.sh

      - name: proportionality smoke test
        run: bash tests/test-proportionality-check.sh
